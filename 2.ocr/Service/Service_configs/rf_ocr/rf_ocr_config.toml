[paths]
tessdata_dir = "C:/Program Files/Tesseract-OCR/tessdata"

[database]
extensions = [".db", ".sqlite", ".sqlite3"]
skip_dirs = ["__pycache__", "node_modules", "venv", ".venv"]
max_scan_depth = 4
busy_timeout_s = 30.0

[ocr_engine]
whitelist = "0123456789.-"
suspicious_confidence = 80.0
fallback_psm = 7

[image_tuning]
clahe_tile = 8
bilateral_sigma = 50.0
nlmeans_strength = 10.0
sharpen_sigma = 1.5
enlarge_interp = "cubic"
pad_value = 255

[export]
file_name = "OCR_Results.xlsx"
format = "xlsx"
xlsx_row_limit = 1048575
sheet_name = "Sheet1"

[gui]
title = "RF OCR Toolkit"
window_geometry = "1200x780"
min_width = 900
min_height = 600
refresh_ms = 300
preview_debounce_ms = 250
preview_max_width = 500
preview_max_height = 200
sample_max_width = 380
sample_max_height = 160

[runtime]
reserved_cores = 1
min_queue_size = 2
auto_chunk_min = 10
auto_chunk_max = 500
auto_chunk_batches_per_worker = 20
min_chunk = 10
max_chunk_factor = 4
max_chunk_floor = 50
chunk_shrink_factor = 0.7
chunk_grow_factor = 1.1
ram_hysteresis_percent = 5.0
resource_sample_s = 1.0
poll_interval_s = 1.0
queue_put_timeout_s = 5.0
pause_poll_s = 0.2
drain_timeout_s = 0.5
join_timeout_s = 5.0
feeder_join_timeout_s = 10.0
shutdown_wait_s = 15.0

[naming]
gray_mode = "min"
strip_prefix = "sweep_"

[ocr]
lang = "custom"
psm = 7
stage = "enlarge_otsu"
regex = "-?\\d+(\\.\\d+)?"

[workers_memory]
workers = 0
chunk_size = 0
queue_maxsize = 32
max_ram_percent = 85.0
worker_timeout = 120.0

[image_prepare]
img_crop = 0
img_invert = false
img_scale = 1.0
img_interp = "cubic"
img_denoise = "none"
img_denoise_size = 3
img_contrast = "none"
img_clahe_clip = 2.0
img_gamma = 1.0
img_sharpen = 0.0

[image_threshold]
img_threshold = "otsu"
img_thr_fixed = 128
img_thr_block = 31
img_thr_c = 10.0
img_morph = "none"
img_morph_size = 2
img_pad = 10
img_enlarge = 2.0

[state]
input_folder = "C:/Users/pyk/Downloads/Codes/#Databases"
output_folder = "C:\\Users\\pyk\\Downloads\\Codes\\#Xlsx"
